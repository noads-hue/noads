# TEMPORAL (rama diag-miruro): lee unas páginas de Miruro desde GitHub y las sube a la rama para estudiar su formato.
name: "diag: Miruro"
on:
  push:
    branches: [diag-miruro]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi
      - env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: python cine/Archivos/build_monos.py --carpeta cine/Archivos --solo series 2>&1 | tee diag/fichas_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/ cine/Archivos/
          git commit -m "diag: páginas de Miruro" || exit 0
          git push
