# Arma cada 3 horas, con cine/Archivos/build_enlaces.py, el archivo cine/Archivos/enlaces.json: para cada serie del
# Top 10, Más vistos y el Catálogo (VeoHentai) deja ya resuelta su serie en MuchoHentai con todos sus episodios,
# tal como la calcularía la app al tocarla. Cada corrida resuelve hasta 100 series (primero el Home, luego el catálogo
# que falte) y conserva lo ya resuelto. GitHub Pages lo sirve en https://noads-hue.github.io/noads/cine/Archivos/enlaces.json
# (config/urls/enlaces en Firebase).
#
# Para cambiar cada cuánto corre, toca solo la línea del cron (hora UTC; Lima = UTC-5).
# También se puede lanzar a mano: pestaña Actions → "Enlaces de series" → Run workflow.

name: Enlaces de series

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enlaces
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bajar el repo (solo la carpeta de los JSON, sin las imágenes)
        uses: actions/checkout@v4
        with:
          sparse-checkout: cine/Archivos

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests curl_cffi

      - name: Resolver enlaces
        run: |
          python cine/Archivos/build_enlaces.py --carpeta cine/Archivos 2>&1 | tee salida.txt; rc=${PIPESTATUS[0]}
          { echo '```'; cat salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Subir al repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f cine/Archivos/enlaces.json ]; then git add cine/Archivos/enlaces.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "Enlaces de series: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -q origin main || true
          git push
