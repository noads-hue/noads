# Arma cada 3 horas, con cine/Archivos/build_catalogo.py, el Catálogo y los Géneros del modo privado de Nimaru:
#   cine/Archivos/catalogo.json   todas las páginas de veohentai.com/explorar/
#   cine/Archivos/generos.json    la lista de géneros con miniatura y primera página de cada uno
# GitHub Pages los sirve en https://noads-hue.github.io/noads/cine/Archivos/ y la app solo los descarga
# (config/urls/catalogo y config/urls/generos en Firebase).
#
# Solo se suben si cambiaron (o cada 12 h para renovar la fecha), así el repo no crece de más.
# Para cambiar cada cuánto corre, toca solo la línea del cron (hora UTC; Lima = UTC-5):
#   "41 */3 * * *"  cada 3 horas, al minuto 41
#   "41 * * * *"    cada hora
# También se puede lanzar a mano: pestaña Actions → "Catálogo y Géneros" → Run workflow.

name: Catálogo y Géneros

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Bajar el repo (solo la carpeta de los JSON, sin las imágenes)
        uses: actions/checkout@v4
        with:
          sparse-checkout: cine/Archivos

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4 html5lib curl_cffi

      - name: Armar catalogo.json y generos.json
        run: |
          python cine/Archivos/build_catalogo.py --carpeta cine/Archivos 2>&1 | tee salida.txt; rc=${PIPESTATUS[0]}
          { echo '```'; cat salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Subir al repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cine/Archivos/catalogo.json cine/Archivos/generos.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "Catálogo y géneros: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -q origin main || true
          git push
